name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build web --release
      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CUSTODOCE_B07CE }}" > serviceAccountKey.json
          firebase deploy --only hosting --project custodoce-b07ce --token $(firebase login:ci 2>/dev/null || echo "") 2>&1 || true
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
